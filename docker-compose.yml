# ACHTUNG: Nur für die lokale Entwicklung. Die Zugangsdaten sind bewusst
# trivial und dürfen NIEMALS in einer produktiven Umgebung verwendet werden.
version: '3'

services:
  db:
    image: mariadb:10.11
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-dev_root_pass}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-dev_pass}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  app:
    image: nextcloud:30-apache
    restart: always
    ports:
      - 8080:80
    depends_on:
      - db
    volumes:
      - nextcloud:/var/www/html
      - .:/var/www/html/custom_apps/kursumstufung
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-dev_pass}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-admin}

volumes:
  db:
  nextcloud:
